[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchd"
dynamic = ["version"]
description = "Cross-agent-platform task distribution CLI: event sourcing, file locking, DAG ready-pool, two-phase review"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "jsonschema>=4.20",
]

[project.scripts]
orchd = "orchd.cli:main"

[tool.setuptools.packages.find]
include = ["orchd*"]

[tool.setuptools.package-data]
orchd = [
    "../schema/*.json",
    "../templates/*.md",
]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    # pass9 F14（task-pass9-toolchain-alignment）：超时护栏与覆盖率此前未声明
    # 也未安装——覆盖率不可测量、失控用例裸跑。声明即发版面契约，宿主须同步安装。
    "pytest-timeout>=2.2",
    "pytest-cov>=5.0",
    "setuptools-scm>=8.0",
    "build>=1.0",
    "ruff>=0.6",
    # pass8 F3：mypy 无上界则 CI 按现网最新版解析，新版错误码（如 union-attr）
    # 可把绿染红；上界收紧到 <3。2026-10-08 专项评估结论（task-mypy-2x-strict-core）：
    # 本仓实测 mypy 2.x 不比 1.x 严——去 override 后 1.10.0=77 错、2.3.1/2.4.0=73 错，
    # 无新增错误类，故升级到 2.x。
    "mypy>=2.4,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 规则集：E4/E501/E7/E9（语法+风格核心+行宽门禁）+ F（pyflakes 正确性）。
#
# 豁免范围（唯一四类，与下方 ignore 及 per-file-ignores 基线一一对应；不放宽任何其他规则）：
# - E402：模块级 import 不在文件顶部——子包聚合入口的延迟 re-export，以及引导 sys.path
#   之后才 import 的测试文件
# - F401：子包聚合入口 re-export 与遗留未使用 import（引擎与测试均可能命中）
# - F541：无占位 f-string
# - E501（行宽 100）：存量债以逐文件显式 per-file-ignores 基线豁免
#   （task-linewidth-gate-phase1，idea:line-width-debt-convergence 三阶段根治之阶段 1）。
#   基线纪律：① 逐文件显式条目，禁止目录级/通配豁免；② 基线只减不增——新增超宽行
#   即门禁红灯，须改行而非扩基线；③ 阶段 2 按文件分批清零，阶段 3 撤掉基线使 E501
#   成为全仓真门禁；④ 基线条目数必须等于实测剩余超宽文件数（tests/test_linewidth_gate.py
#   固化该断言，防基线虚胖）。上述三类豁免（E402 / F401 / F541）对强制范围的三处
#   （orchd/ + scripts/ + tests/）同等生效，不按目录区分强度。
#
# 强制范围 = CI lint job 实测执行的 ruff 范围：orchd/ + scripts/ + tests/ 三处，零告警由
# CI 强制（本地 verify 预算 120s 硬上限，重活留在 CI，见 .orchd/rules/verify.md）。
# 本注释不承诺具体处数：数字随代码漂移，实测以 CI 为准。
select = [
    "E4",
    "E501",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E402",
    "F401",
    "F541",
]

# E501 行宽债基线（task-linewidth-gate-phase1）：逐文件显式，只减不增。
# 条目数等实测口径**不在注释中记账**（本段上方「不承诺具体处数」纪律同样适用）：
# 数字随阶段 2 收敛必然漂移，实测判据以 tests/test_linewidth_gate.py 为准
# （该测试断言「基线条目数 == 实测剩余超宽文件数」，注释写死计数只增漂移面）。
# 阶段 2 清零后整块删除。
[tool.ruff.lint.per-file-ignores]
"orchd/cli/commands/ideas.py" = ["E501"]
"orchd/cli/commands/init.py" = ["E501"]
# W6-C7：misc 子包化，存量超宽行随代码落点迁到 registration（register 的 help 串）
# 与 storage（recutover 说明串）两域；单文件键删除（不是放宽，是债务随文件搬家）。
"orchd/cli/commands/misc/registration.py" = ["E501"]
"orchd/cli/commands/misc/storage.py" = ["E501"]
"orchd/cli/commands/query.py" = ["E501"]

"orchd/cli/commands/workflow.py" = ["E501"]
"orchd/cli/identity.py" = ["E501"]
"orchd/cli/parser.py" = ["E501"]
"orchd/errors.py" = ["E501"]
# W6-C8：`orchd/gitops/hook.py` 拆为子包后，原有超宽行随「纯搬移」逐字继承：
# content.py 2 处 f-string、precommit_template.py 的模板内嵌脚本文本。
# 缩短需改模板渲染语义（属重构卡），故按基线豁免而非改短（纯搬移红线）。
"orchd/gitops/hook/content.py" = ["E501"]
"orchd/gitops/hook/precommit_template.py" = ["E501"]
# W8-10（task-split2-w8-10-gitops-query-pkg）：gitops/query.py 拆为 query/ 六域包，两处 102 列存量行
# 随代码落点迁到 refs（默认分支探测）与 workspace（工作区状态）两域；单文件键删除（债务随文件搬家）。
"orchd/gitops/query/refs.py" = ["E501"]
"orchd/gitops/query/workspace.py" = ["E501"]
# guide 建包（file-split-program W5-G1，2026-10-18）：存量超宽行全部留在聚合入口
# （错误码注册表 E001–E040 行 + GUIDANCE_STEPS 注释），paths/digest 两域零超宽 ⇒
# 键随实际落点迁移，不是放宽基线。
"orchd/guide/__init__.py" = ["E501"]
# W5-G2/G3：stage 承接 _classify 的 step 判定表；errors 承接错误码注册表（E001–E040 行）。
# 键逐文件显式跟随实际落点（flow/rules/paths/digest 已无超宽行，故无键）。
"orchd/guide/errors.py" = ["E501"]
"orchd/guide/stage.py" = ["E501"]
# W6-C7：intake 子包化，存量超宽行随落点迁到 idea（种子写入门禁说明）与 roadmap
# （落点表说明）两域；单文件键删除。
"orchd/intake/idea.py" = ["E501"]
"orchd/intake/roadmap.py" = ["E501"]
# ledger 建包（file-split-program W1-L1，2026-10-15）：键必须指向实际落点
# 文件且逐文件显式（禁通配 / 禁目录级）——口径同 tests/test_linewidth_gate.py AC2
# L7（task-split2-ledger-l7-store）：Store 域的存量超宽行随代码落点迁到 store.py。
# L8（task-split2-ledger-l8-store-segmentation）：Store 类四段 mixin 化后存量超宽行
# 再随代码落点迁到 store_write.py（store.py 退化为骨架、自身已无超宽行），键随实际
# 落点迁移（不是放宽，是债务随文件搬家）。
"orchd/ledger/store_write.py" = ["E501"]
# L3（task-split2-ledger-l3-identity）：身份与会话域的存量超宽行随代码落点迁移到
# identity.py——键跟随实际落点，与 L1 的口径一致（不是放宽，是债务随文件搬家）。
"orchd/ledger/identity.py" = ["E501"]
"orchd/lockfile.py" = ["E501"]
"orchd/onboard/bootstrap.py" = ["E501"]
"orchd/onboard/control.py" = ["E501"]
"orchd/onboard/lifecycle/guards.py" = ["E501"]
# W8-7（task-split2-w8-7-onboard-request-pkg）：onboard/request.py 拆为 request/ 六域包，存量超宽行
# 随代码落点迁到 conflicts（6 处 dict 字面量）/ entry（11 处编排结果字面量）/ routing（15 处）三域；
# 单文件键删除（不是放宽，是债务随文件搬家；test_linewidth_gate 集合相等仍锁）。
"orchd/onboard/request/conflicts.py" = ["E501"]
"orchd/onboard/request/entry.py" = ["E501"]
"orchd/onboard/request/routing.py" = ["E501"]
"orchd/report/status.py" = ["E501"]
"orchd/spec/quality.py" = ["E501"]
"orchd/spec/roadmap.py" = ["E501"]

# W6-C7：worktree.lifecycle 子包化，存量超宽行随落点迁到 create（ensure 说明）与
# probe（注册路径探测说明）两域；单文件键删除。
"orchd/worktree/lifecycle/create.py" = ["E501"]
"orchd/worktree/lifecycle/probe.py" = ["E501"]
"scripts/verify_cross_platform.py" = ["E501"]
"scripts/verify_install.py" = ["E501"]
"scripts/verify_release_self_contained.py" = ["E501"]
"tests/test_claim.py" = ["E501"]
"tests/test_cli_control.py" = ["E501"]
"tests/test_cli_ideas.py" = ["E501"]
"tests/test_cli_init.py" = ["E501"]
"tests/test_cli_misc.py" = ["E501"]
"tests/test_cli_query.py" = ["E501"]
"tests/test_cli_session.py" = ["E501"]
"tests/test_cli_workflow.py" = ["E501"]
"tests/test_concurrency.py" = ["E501"]
"tests/test_conflict_paths.py" = ["E501"]
"tests/test_control.py" = ["E501"]
"tests/test_docs.py" = ["E501"]
"tests/test_doctor.py" = ["E501"]
"tests/test_done.py" = ["E501"]
"tests/test_e2e.py" = ["E501"]
"tests/test_git_guards.py" = ["E501"]
"tests/test_gitops.py" = ["E501"]
"tests/test_guide.py" = ["E501"]
"tests/test_installer.py" = ["E501"]
"tests/test_ledger.py" = ["E501"]
"tests/test_misc.py" = ["E501"]
"tests/test_onboard.py" = ["E501"]
"tests/test_report.py" = ["E501"]
"tests/test_retract_bind_cooloff.py" = ["E501"]
"tests/test_review.py" = ["E501"]
"tests/test_session_identity.py" = ["E501"]
"tests/test_session_lock_acquire_respect.py" = ["E501"]
"tests/test_spec.py" = ["E501"]
"tests/test_split.py" = ["E501"]
"tests/test_split_guard_fallback.py" = ["E501"]
"tests/test_worktree.py" = ["E501"]
"orchd/worktree/layout/migration.py" = ["E501"]
"orchd/worktree/layout/paths.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 并行：-n auto 按 CPU 核数起 worker；--dist=loadscope 按模块/类分组（session 级夹具
# 每 worker 只执行一次，避免 test_packaging 同步脚本被多 worker 重复执行）；
# --strict-markers 拦截未注册 marker；--durations=20 每次回归产出热点数据。
#
# 日常 pytest（多 agent 并发跑）保持 -n auto + numbered tmpdir，不动 basetemp。
# 全量回归（独占通道，一次一人跑）应在调用方显式覆盖：
#   --basetemp=C:/Temp/orchd-fr-baseline -n 8 --max-worker-restart=5
# 详见 design/full-regression-parallel-crash-fix-20260830.md。固定 basetemp 仅
# 适用于独占回归通道，日常多会话并发不要固定单一路径（会互相覆盖/删除）。
addopts = "-n auto --dist=loadscope --strict-markers --durations=20"
markers = [
    "slow: 慢速测试（长锁等待/真安装/构建），常规集默认忽略（-m 'not slow' 或 CI 烟测子集）",
]

# =====================================================================
# 类型检查（task-decl-ci-contract-verification，审查报告 T-1）
# =====================================================================
# 首轮宽松策略：让 ``python -m mypy orchd/`` 以退出码 0 通过，把存量类型错误按
# 子包收敛到下方 overrides（``ignore_errors = true``）。意图不是掩盖——而是把
# "已声明契约缺少对应强度验证"先补上（CI mypy job 见 .github/workflows/ci.yml），
# 再按"收紧路线"逐个子包移除 overrides，使该子包进入强类型检查。
#
# 存量错误基线（mypy 1.10.0，--ignore-missing-imports，55 源文件）：59 errors / 20 files。
# 各子包分布（按文件计，含概览）：
#   orchd.ledger ............. 5  (StorageBackend 缺 ledger_path/checkpoint_path/lock_path/_file_lock attr)
#   orchd.guide .............. 11 (本应是 int 的变量被赋 list/str/None；union-attr)
#   orchd.split .............. 5  (Any|None 不可索引 / 与 set[Any] 不兼容)
#   orchd.review ............. 4  (str|None 不可索引；remove_task_wt 收到 Path|None)
#   orchd.cli.commands ....... 12 (workflow/query/control 大量 untyped 回调与 _cli_skeleton 签名不符)
#   orchd.onboard ............ 7  (make_event 收 str|None；union-attr review_phase/attempt_count)
#   orchd.worktree ........... 2  (str|None / no-redef)
#   orchd.lessons ............ 3  (set[int] vs list[int]|None；in 操作数)
#   orchd.pool ............... 1  (TaskState|None 赋值)
#   orchd.doctor ............. 1  (Set comprehension 含 Any|None)
#   orchd.report ............. 2  (Collection 与 dict 不兼容)
#   orchd.cli.skeleton ....... 1  (call-arg)
#   orchd.cli._util .......... 1  (Path|None 赋值)
#   orchd.ledger_sync ........ 1  (StorageBackend 缺 orchd_dir attr)
#   orchd.cli.commands.init .. 2  (__iadd__ 类型不符)
#
# 收紧路线已走完（2026-10-08，task-mypy-2x-strict-core / -guide-and-cli-skeleton /
# -cli-commands / -onboard 四批承接）：全部 [[tool.mypy.overrides]] ignore_errors
# 已移除，orchd/ 现为全量强类型检查，`python -m mypy orchd/` 直接守门。
# 上列「存量错误基线」为历史记录（收敛前），不再维护——当前真源即 mypy 实跑。
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
# 仅对 orchd/ 做类型检查；scripts/ 与 tests/ 由 lint 门禁覆盖且 untyped 较多。
# W7-Z2 尺寸棘轮（`scripts/file_census.py` + 仓根 `file-census-baseline.json`）同理不在此面内：
# 前者由 ruff + 运行时守卫 `tests/test_file_census_ratchet.py` 覆盖，后者是数据文件不是代码；
# 若将来决定把 scripts/ 纳入 mypy，只需在 CI 的 mypy 命令里补上该路径即可。
# 2026-10-08（task-mypy-strict-onboard，mypy 收紧路线终点）：全部 ignore_errors
# override 已移除，orchd/ 现为全量强类型检查——任何新类型错误将直接红。

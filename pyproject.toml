[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchd"
dynamic = ["version"]
description = "Cross-agent-platform task distribution CLI: event sourcing, file locking, DAG ready-pool, two-phase review"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "jsonschema>=4.20",
]

[project.scripts]
orchd = "orchd.cli:main"

[tool.setuptools.packages.find]
include = ["orchd*"]

[tool.setuptools.package-data]
orchd = [
    "../schema/*.json",
    "../templates/*.md",
]

[tool.setuptools_scm]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "setuptools-scm>=8.0",
    "build>=1.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 规则集：E4/E501/E7/E9（语法+风格核心+行宽门禁）+ F（pyflakes 正确性）。
#
# 豁免范围（唯一四类，与下方 ignore 及 per-file-ignores 基线一一对应；不放宽任何其他规则）：
# - E402：模块级 import 不在文件顶部——子包聚合入口的延迟 re-export，以及引导 sys.path
#   之后才 import 的测试文件
# - F401：子包聚合入口 re-export 与遗留未使用 import（引擎与测试均可能命中）
# - F541：无占位 f-string
# - E501（行宽 100）：存量债以逐文件显式 per-file-ignores 基线豁免
#   （task-linewidth-gate-phase1，idea:line-width-debt-convergence 三阶段根治之阶段 1）。
#   基线纪律：① 逐文件显式条目，禁止目录级/通配豁免；② 基线只减不增——新增超宽行
#   即门禁红灯，须改行而非扩基线；③ 阶段 2 按文件分批清零，阶段 3 撤掉基线使 E501
#   成为全仓真门禁；④ 基线条目数必须等于实测剩余超宽文件数（tests/test_linewidth_gate.py
#   固化该断言，防基线虚胖）。上述三类豁免（E402 / F401 / F541）对强制范围的三处
#   （orchd/ + scripts/ + tests/）同等生效，不按目录区分强度。
#
# 强制范围 = CI lint job 实测执行的 ruff 范围：orchd/ + scripts/ + tests/ 三处，零告警由
# CI 强制（本地 verify 预算 120s 硬上限，重活留在 CI，见 .orchd/rules/verify.md）。
# 本注释不承诺具体处数：数字随代码漂移，实测以 CI 为准。
select = [
    "E4",
    "E501",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E402",
    "F401",
    "F541",
]

# E501 行宽债基线（task-linewidth-gate-phase1）：逐文件显式，只减不增。
# 条目数等实测口径**不在注释中记账**（本段上方「不承诺具体处数」纪律同样适用）：
# 数字随阶段 2 收敛必然漂移，实测判据以 tests/test_linewidth_gate.py 为准
# （该测试断言「基线条目数 == 实测剩余超宽文件数」，注释写死计数只增漂移面）。
# 阶段 2 清零后整块删除。
[tool.ruff.lint.per-file-ignores]
"orchd/cli/commands/control.py" = ["E501"]
"orchd/cli/commands/ideas.py" = ["E501"]
"orchd/cli/commands/init.py" = ["E501"]
"orchd/cli/commands/misc.py" = ["E501"]
"orchd/cli/commands/query.py" = ["E501"]

"orchd/cli/commands/workflow.py" = ["E501"]
"orchd/cli/identity.py" = ["E501"]
"orchd/cli/parser.py" = ["E501"]
"orchd/doctor.py" = ["E501"]
"orchd/errors.py" = ["E501"]
"orchd/gitops/hook.py" = ["E501"]
"orchd/gitops/query.py" = ["E501"]
"orchd/guide.py" = ["E501"]
"orchd/intake.py" = ["E501"]
"orchd/ledger.py" = ["E501"]
"orchd/lockfile.py" = ["E501"]
"orchd/onboard/bootstrap.py" = ["E501"]
"orchd/onboard/claim.py" = ["E501"]
"orchd/onboard/control.py" = ["E501"]
"orchd/onboard/lifecycle/guards.py" = ["E501"]
"orchd/onboard/request.py" = ["E501"]
"orchd/report.py" = ["E501"]
"orchd/review.py" = ["E501"]
"orchd/spec.py" = ["E501"]
"orchd/worktree.py" = ["E501"]
"scripts/verify_cross_platform.py" = ["E501"]
"scripts/verify_install.py" = ["E501"]
"scripts/verify_release_self_contained.py" = ["E501"]
"tests/test_claim.py" = ["E501"]
"tests/test_cli_control.py" = ["E501"]
"tests/test_cli_ideas.py" = ["E501"]
"tests/test_cli_init.py" = ["E501"]
"tests/test_cli_misc.py" = ["E501"]
"tests/test_cli_query.py" = ["E501"]
"tests/test_cli_session.py" = ["E501"]
"tests/test_cli_workflow.py" = ["E501"]
"tests/test_concurrency.py" = ["E501"]
"tests/test_conflict_paths.py" = ["E501"]
"tests/test_control.py" = ["E501"]
"tests/test_docs.py" = ["E501"]
"tests/test_doctor.py" = ["E501"]
"tests/test_done.py" = ["E501"]
"tests/test_e2e.py" = ["E501"]
"tests/test_git_guards.py" = ["E501"]
"tests/test_gitops.py" = ["E501"]
"tests/test_guide.py" = ["E501"]
"tests/test_installer.py" = ["E501"]
"tests/test_ledger.py" = ["E501"]
"tests/test_misc.py" = ["E501"]
"tests/test_onboard.py" = ["E501"]
"tests/test_report.py" = ["E501"]
"tests/test_retract_bind_cooloff.py" = ["E501"]
"tests/test_review.py" = ["E501"]
"tests/test_session_identity.py" = ["E501"]
"tests/test_session_lock_acquire_respect.py" = ["E501"]
"tests/test_spec.py" = ["E501"]
"tests/test_split.py" = ["E501"]
"tests/test_split_guard_fallback.py" = ["E501"]
"tests/test_worktree.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 并行：-n auto 按 CPU 核数起 worker；--dist=loadscope 按模块/类分组（session 级夹具
# 每 worker 只执行一次，避免 test_packaging 同步脚本被多 worker 重复执行）；
# --strict-markers 拦截未注册 marker；--durations=20 每次回归产出热点数据。
#
# 日常 pytest（多 agent 并发跑）保持 -n auto + numbered tmpdir，不动 basetemp。
# 全量回归（独占通道，一次一人跑）应在调用方显式覆盖：
#   --basetemp=C:/Temp/orchd-fr-baseline -n 8 --max-worker-restart=5
# 详见 design/full-regression-parallel-crash-fix-20260830.md。固定 basetemp 仅
# 适用于独占回归通道，日常多会话并发不要固定单一路径（会互相覆盖/删除）。
addopts = "-n auto --dist=loadscope --strict-markers --durations=20"
markers = [
    "slow: 慢速测试（长锁等待/真安装/构建），常规集默认忽略（-m 'not slow' 或 CI 烟测子集）",
]

# =====================================================================
# 类型检查（task-decl-ci-contract-verification，审查报告 T-1）
# =====================================================================
# 首轮宽松策略：让 ``python -m mypy orchd/`` 以退出码 0 通过，把存量类型错误按
# 子包收敛到下方 overrides（``ignore_errors = true``）。意图不是掩盖——而是把
# "已声明契约缺少对应强度验证"先补上（CI mypy job 见 .github/workflows/ci.yml），
# 再按"收紧路线"逐个子包移除 overrides，使该子包进入强类型检查。
#
# 存量错误基线（mypy 1.10.0，--ignore-missing-imports，55 源文件）：59 errors / 20 files。
# 各子包分布（按文件计，含概览）：
#   orchd.ledger ............. 5  (StorageBackend 缺 ledger_path/checkpoint_path/lock_path/_file_lock attr)
#   orchd.guide .............. 11 (本应是 int 的变量被赋 list/str/None；union-attr)
#   orchd.split .............. 5  (Any|None 不可索引 / 与 set[Any] 不兼容)
#   orchd.review ............. 4  (str|None 不可索引；remove_task_wt 收到 Path|None)
#   orchd.cli.commands ....... 12 (workflow/query/control 大量 untyped 回调与 _cli_skeleton 签名不符)
#   orchd.onboard ............ 7  (make_event 收 str|None；union-attr review_phase/attempt_count)
#   orchd.worktree ........... 2  (str|None / no-redef)
#   orchd.lessons ............ 3  (set[int] vs list[int]|None；in 操作数)
#   orchd.pool ............... 1  (TaskState|None 赋值)
#   orchd.doctor ............. 1  (Set comprehension 含 Any|None)
#   orchd.report ............. 2  (Collection 与 dict 不兼容)
#   orchd.cli.skeleton ....... 1  (call-arg)
#   orchd.cli._util .......... 1  (Path|None 赋值)
#   orchd.ledger_sync ........ 1  (StorageBackend 缺 orchd_dir attr)
#   orchd.cli.commands.init .. 2  (__iadd__ 类型不符)
#
# 收紧路线（按模块移除 overrides 的顺序，由易到难）：
#   ① orchd.ledger_sync ✅（task-quality-debt-and-ci 已移除）→ ② orchd.doctor ✅
#   → ③ orchd.pool ✅ → ④ orchd.cli._util
#   → ⑤ orchd.cli.skeleton → ⑥ orchd.report → ⑦ orchd.split → ⑧ orchd.review
#   → ⑨ orchd.ledger → ⑩ orchd.worktree → ⑪ orchd.lessons → ⑫ orchd.guide
#   → ⑬ orchd.onboard.*（最后，union-attr 多）→ ⑭ orchd.cli.commands.*
#   （cli 层大量 untyped 回调 + 动态类型，留到最后；收紧时同步给 _cli_skeleton
#    补 Callable 泛型或 # type: ignore 局部标注）
#
# 已移除的三个模块当前处于强类型检查（无 ignore_errors，task-quality-debt-and-ci）：
#   - orchd.ledger_sync：_store_runtime_root 经 isinstance(FilesystemBackend) 收窄
#     backend.orchd_dir（StorageBackend 接口不暴露该属性；非文件系统后端抛 RuntimeError）
#   - orchd.doctor：_load_master_task_ids 的 set 推导改显式 isinstance(str) 过滤
#   - orchd.pool：claimed_files 中 state.get 复用变量加显式 `TaskState | None` 注解
# 其余 17 个 override 按上述收敛路线逐个移除，每移除一个须保证 mypy 全绿一次。
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
# 仅对 orchd/ 做类型检查；scripts/ 与 tests/ 由 lint 门禁覆盖且 untyped 较多。

[[tool.mypy.overrides]]
module = "orchd.ledger"
ignore_errors = true

[[tool.mypy.overrides]]

module = "orchd.guide"
ignore_errors = true

[[tool.mypy.overrides]]
module = "orchd.split"
ignore_errors = true

[[tool.mypy.overrides]]
module = "orchd.review"
ignore_errors = true

[[tool.mypy.overrides]]

module = "orchd.lessons"
ignore_errors = true

[[tool.mypy.overrides]]
module = "orchd.worktree"
ignore_errors = true

[[tool.mypy.overrides]]

module = "orchd.report"
ignore_errors = true

[[tool.mypy.overrides]]
module = "orchd.cli._util"
ignore_errors = true

[[tool.mypy.overrides]]
module = "orchd.cli.skeleton"
ignore_errors = true

[[tool.mypy.overrides]]
module = "orchd.onboard"
ignore_errors = true

[[tool.mypy.overrides]]
module = "orchd.onboard.claim"
ignore_errors = true

[[tool.mypy.overrides]]
